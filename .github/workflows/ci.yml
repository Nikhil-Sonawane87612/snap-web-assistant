name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check all extension scripts
        run: |
          set -e
          for f in background.js content.js bridge.js popup.js; do
            node --check "$f"
          done

      - name: Validate manifest
        run: |
          set -e
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Detect mojibake and BOMs
        run: |
          node scripts/check-mojibake.cjs \
            background.js content.js bridge.js popup.js \
            popup.html manifest.json README.md